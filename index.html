<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社内AI勉強会</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --accent: #4f46e5;
      --accent-strong: #312e81;
      --text: #1f2933;
      --muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .announcement {
      width: min(960px, 100%);
      background: var(--surface);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(79, 70, 229, 0.12);
      overflow: hidden;
      display: grid;
      grid-template-rows: 320px auto;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(110%);
      transform: scale(1.02);
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.65), rgba(79, 70, 229, 0) 60%);
      mix-blend-mode: multiply;
    }

    .hero-text {
      position: absolute;
      bottom: 32px;
      left: 32px;
      right: 32px;
      color: white;
      text-shadow: 0 6px 18px rgba(17, 24, 39, 0.45);
    }

    .hero-text span {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .hero-text h1 {
      font-size: clamp(2.2rem, 4vw, 3.1rem);
      line-height: 1.1;
      font-weight: 700;
    }

    .details {
      padding: 36px clamp(28px, 6vw, 56px);
      display: grid;
      gap: 28px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      background: linear-gradient(180deg, rgba(79, 70, 229, 0.04), transparent 55%);
    }

    .detail-card {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(79, 70, 229, 0.1);
      backdrop-filter: blur(10px);
      display: grid;
      gap: 10px;
    }

    .detail-card h2 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent-strong);
      text-transform: uppercase;
    }

    .detail-card p {
      font-size: 1.15rem;
      line-height: 1.4;
      color: var(--text);
    }

    .detail-card p strong {
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 720px) {
      body {
        padding: 24px 16px;
      }

      .announcement {
        border-radius: 22px;
        grid-template-rows: 260px auto;
      }

      .hero-text {
        bottom: 24px;
        left: 20px;
        right: 20px;
      }

      .details {
        padding: 28px 22px 36px;
        gap: 20px;
      }

      .detail-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="announcement" aria-labelledby="event-title">
    <section class="hero" aria-hidden="true">
      <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1600&q=80" alt="チームで議論しているビジネスパーソンの写真" />
      <div class="hero-text">
        <span>Internal Workshop</span>
        <h1 id="event-title">AIが創る、次世代の働き方を学ぼう</h1>
      </div>
    </section>
    <section class="details" aria-label="イベント詳細">
      <article class="detail-card">
        <h2>タイトル</h2>
        <p>社内AI活用最前線 〜業務改善アイデアソン〜</p>
      </article>
      <article class="detail-card">
        <h2>開催日時</h2>
        <p><strong>2024年5月23日（木）</strong><br />18:00 - 20:30</p>
      </article>
      <article class="detail-card">
        <h2>場所</h2>
        <p>東京本社 イノベーションラボ（12F）<br />オンライン同時配信あり</p>
      </article>
    </section>
  </main>
</body>
</html>
